<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Проверка доступности аудиторий{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🔍 Проверка доступности</h1>
            </div>
            <div class="nav-links">
                <a href="{% url 'home' %}" class="nav-link">Главная</a>
                <a href="{% url 'room_list' %}" class="nav-link">Аудитории</a>
                <a href="{% url 'schedule_list' %}" class="nav-link">Расписание</a>
                <a href="/api/" class="nav-link">API</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Система проверки доступности аудиторий | Студент B</p>
        </div>
    </footer>

    <script src="/static/js/script.js"></script>
</body>
</html>
